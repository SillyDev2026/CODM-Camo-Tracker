name: Install CamoVault site
on:
  push:
    paths:
      - 'CamoVault-GitHub-Pages-v1.0.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract CamoVault source files
        run: |
          test -f CamoVault-GitHub-Pages-v1.0.zip
          unzip -o CamoVault-GitHub-Pages-v1.0.zip -d .
          test -f index.html
          test -f js/app.js
          test -f assets/style.css
      - name: Commit installed website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install CamoVault static site"
          git push
