name: Import licensed Gunsmith 3D models
on:
  push:
    paths:
      - '.github/workflows/import-weapon-models.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gun-model-import
  cancel-in-progress: false
jobs:
  import-models:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CamoVault
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve public-domain models from pinned source revisions
        run: python scripts/import_models.py
      - name: Vendor 3D WebGL viewer from pinned Apache-2.0 release
        run: python scripts/vendor_viewer.py
      - name: Commit licensed 3D models and WebGL viewer to this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/*.glb assets/vendor/model-viewer.min.js
          if git diff --cached --quiet; then
            echo "Models are already in sync."
          else
            git commit -m "Import CC0 GLB models and licensed WebGL viewer"
            git push origin HEAD:main
          fi
